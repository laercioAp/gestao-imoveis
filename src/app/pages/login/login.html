<div class="login-container">
  <div class="login-card">

    <div class="login-header">
      <div class="logo">
        <i class="bi bi-house-door-fill"></i>
      </div>

      <h2>Gestão de Aluguéis</h2>
      <p>Entre com seus dados para continuar</p>
    </div>

    <form (ngSubmit)="entrar()" #loginForm="ngForm">

      <div class="form-group">
        <label for="email">E-mail</label>

        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="Digite seu e-mail"
          [(ngModel)]="email"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>

        <div class="password-container">
          <input
            [type]="mostrarSenha ? 'text' : 'password'"
            id="senha"
            name="senha"
            class="form-control"
            placeholder="Digite sua senha"
            [(ngModel)]="senha"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            (click)="mostrarSenha = !mostrarSenha"
            [attr.aria-label]="mostrarSenha ? 'Ocultar senha' : 'Mostrar senha'"
          >
            <i [class]="mostrarSenha ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <div class="error-message" *ngIf="erro">
        <i class="bi bi-exclamation-circle"></i>
        {{ erro }}
      </div>

      <button
        type="submit"
        class="btn-login"
        [disabled]="carregando || !loginForm.valid"
      >
        <span *ngIf="!carregando">Entrar</span>

        <span *ngIf="carregando">
          <span class="spinner-border spinner-border-sm me-2"></span>
          Entrando...
        </span>
      </button>

    </form>

    <div class="login-footer">
      Sistema de Gestão de Aluguéis
    </div>

  </div>
</div>
